{% comment %}
Renderiza un campo de formulario con su etiqueta, ayuda y errores.
Uso: {% include "parciales/campo.html" with campo=form.ciudad %}
{% endcomment %}
<div class="mb-3">
  <label for="{{ campo.id_for_label }}" class="form-label fw-bold">
    {{ campo.label }}{% if campo.field.required %} <span class="obligatorio">*</span>{% endif %}
  </label>
  {{ campo }}
  {% if campo.help_text %}
    <div class="form-text">{{ campo.help_text }}</div>
  {% endif %}
  {% for error in campo.errors %}
    <div class="invalid-feedback d-block">{{ error }}</div>
  {% endfor %}
</div>
