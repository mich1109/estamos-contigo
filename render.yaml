# Configuracion de despliegue para Render.
#
# Con este archivo, Render crea el sitio y la base de datos automaticamente:
# no hay que configurar nada a mano en su panel.
#
# Para usarlo: en Render, "New +" -> "Blueprint" -> elige este repositorio.

services:
  - type: web
    name: estamos-contigo
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /

    # --- Disco persistente para las fotos ---
    #
    # Las cuatro lineas de abajo hacen que las fotos que sube la gente NO se
    # borren en cada actualizacion del sitio.
    #
    # Solo funcionan con el plan Starter o superior. En el plan gratuito, este
    # archivo falla al sincronizar ("Failed sync") y el sitio no se actualiza.
    #
    # CUANDO ACTIVES EL PLAN DE PAGO: quita el "#" de las cuatro lineas y
    # agrega la variable MEDIA_ROOT con el valor /var/data/media.
    #
    # disk:
    #   name: fotos
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      # Clave de seguridad. Render genera una aleatoria y la mantiene secreta.
      - key: SECRET_KEY
        generateValue: true

      # Produccion: activa HTTPS obligatorio, cookies seguras y HSTS.
      - key: DEBUG
        value: "False"

      # El modo local solo sirve para ver el sitio en tu computador.
      - key: MODO_LOCAL
        value: "False"

      # El dominio real lo agrega Django solo, leyendo RENDER_EXTERNAL_HOSTNAME.
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"

      # Conexion a la base de datos de abajo.
      - key: DATABASE_URL
        fromDatabase:
          name: estamos-contigo-db
          property: connectionString

      - key: PYTHON_VERSION
        value: "3.12.7"

      # MEDIA_ROOT solo hace falta cuando exista el disco persistente (plan de
      # pago). Sin el, Django usa la carpeta media/ del proyecto, que funciona
      # pero se borra en cada actualizacion del sitio.
      #
      # CUANDO ACTIVES EL PLAN DE PAGO: descomenta estas dos lineas.
      #
      # - key: MEDIA_ROOT
      #   value: /var/data/media

      # --- Administrador inicial ---
      # El plan gratuito no da acceso a terminal, asi que el primer
      # administrador se crea durante el despliegue con estos valores.
      #
      # sync: false hace que Render los pida en su panel y los guarde de forma
      # segura: nunca quedan escritos en el codigo ni en GitHub.
      #
      # Una vez creado el usuario, entra al sitio, cambia la contrasena y
      # BORRA ADMIN_CLAVE desde Render > Environment.
      - key: ADMIN_USUARIO
        sync: false
      - key: ADMIN_CLAVE
        sync: false
      - key: ADMIN_CORREO
        sync: false

databases:
  - name: estamos-contigo-db
    databaseName: estamos_contigo
    plan: free
    region: oregon
